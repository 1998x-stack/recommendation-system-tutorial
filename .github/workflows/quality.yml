name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install QA dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Run executable examples
        run: python -m unittest discover -s tests -v

      - name: Check Markdown and HTML consistency
        run: python scripts/validate_content.py --report artifacts/content-quality.json

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run responsive browser checks
        run: python scripts/browser_smoke.py --output artifacts/browser-qa

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-system-quality-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

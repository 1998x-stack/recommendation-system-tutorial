<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
<title id="title">推荐系统从候选到反馈的闭环</title>
<desc id="desc">用户、物品和上下文进入候选生成、打分和重排，最终展示列表；用户反馈回流到日志与模型。</desc>
<defs><marker id="arrow-a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#53676d" stroke-width="1.5"/></marker></defs>
<rect x="24" y="34" width="150" height="68" rx="12" fill="#e9f1f2" stroke="#7b9da0"/><text x="99" y="61" text-anchor="middle" font-size="16" fill="#203035">用户 / 物品</text><text x="99" y="83" text-anchor="middle" font-size="13" fill="#53676d">上下文与约束</text>
<rect x="220" y="34" width="150" height="68" rx="12" fill="#dceeed" stroke="#147f80"/><text x="295" y="61" text-anchor="middle" font-size="16" fill="#203035">候选生成</text><text x="295" y="83" text-anchor="middle" font-size="13" fill="#53676d">大库 → 小集合</text>
<rect x="416" y="34" width="150" height="68" rx="12" fill="#f8e7df" stroke="#d06d4d"/><text x="491" y="61" text-anchor="middle" font-size="16" fill="#203035">精细打分</text><text x="491" y="83" text-anchor="middle" font-size="13" fill="#53676d">预测单项效用</text>
<rect x="612" y="34" width="150" height="68" rx="12" fill="#eeeaf8" stroke="#7461ba"/><text x="687" y="61" text-anchor="middle" font-size="16" fill="#203035">列表重排</text><text x="687" y="83" text-anchor="middle" font-size="13" fill="#53676d">多样性与规则</text>
<rect x="794" y="34" width="82" height="68" rx="12" fill="#fff1d9" stroke="#b88a36"/><text x="835" y="61" text-anchor="middle" font-size="15" fill="#203035">展示</text><text x="835" y="82" text-anchor="middle" font-size="12" fill="#53676d">列表</text>
<g stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arrow-a)"><path d="M174 68 H216"/><path d="M370 68 H412"/><path d="M566 68 H608"/><path d="M762 68 H790"/></g>
<rect x="284" y="172" width="330" height="58" rx="12" fill="#f1f4f3" stroke="#9aaba8"/><text x="449" y="196" text-anchor="middle" font-size="15" fill="#203035">曝光、位置、点击、观看、购买与负反馈</text><text x="449" y="216" text-anchor="middle" font-size="12" fill="#53676d">记录请求上下文，形成可审计的训练样本</text>
<path d="M835 102 V144 H614 V170" fill="none" stroke="#916c22" stroke-width="2" marker-end="url(#arrow-a)"/><path d="M284 201 H188 V136 H295 V106" fill="none" stroke="#147f80" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-a)"/>
</svg>